<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Enterprise Dark Slate Container -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Glass Rim Accent Border -->
    <linearGradient id="rim-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Primary 'A' Gradient: Electric Indigo -->
    <linearGradient id="a-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Secondary Accent: Cyan to Violet -->
    <linearGradient id="a-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Premium Dark App Tile Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bg-grad)" />
  <rect width="496" height="496" x="8" y="8" rx="112" fill="none" stroke="url(#rim-grad)" stroke-width="8" />

  <!-- Modern Geometric 'A' Left Pillar -->
  <path d="M 256 88 L 112 424 H 194 L 256 270 Z" fill="url(#a-accent)" opacity="0.9" />

  <!-- Modern Geometric 'A' Right Pillar -->
  <path d="M 256 88 L 400 424 H 318 L 256 270 Z" fill="url(#a-primary)" />

  <!-- Floating Dynamic Crossbar -->
  <polygon points="172,326 340,326 316,370 196,370" fill="url(#a-primary)" />

  <!-- Sharp Glowing Apex Diamond Accent -->
  <polygon points="256,150 274,180 256,210 238,180" fill="#ffffff" />
</svg>
